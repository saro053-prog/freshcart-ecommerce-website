<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Product Feedback | Online Super Market</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand fw-bold" href="/"> Online Super Market </a>

        <a href="/orders" class="btn btn-outline-light"> My Orders </a>
      </div>
    </nav>

    <!-- Feedback Section -->
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
          <div class="card shadow border-0">
            <div class="card-body p-4">
              <h2 class="text-center fw-bold mb-2">Product Feedback</h2>

              <p class="text-center text-muted mb-4">
                Share your experience with this product
              </p>

              <!-- Product -->
              <div class="text-center mb-4">
                <h5 class="fw-bold">{{ product.product_name }}</h5>

                <p class="text-muted mb-0">{{ product.brand_name }}</p>
              </div>

              <!-- Feedback Form -->
              <form method="POST">
                <!-- Rating -->
                <div class="mb-4">
                  <label class="form-label fw-semibold"> Rating </label>

                  <select name="rating" class="form-select" required>
                    <option value="">Select Rating</option>

                    <option value="5">⭐⭐⭐⭐⭐ Excellent</option>

                    <option value="4">⭐⭐⭐⭐ Very Good</option>

                    <option value="3">⭐⭐⭐ Good</option>

                    <option value="2">⭐⭐ Average</option>

                    <option value="1">⭐ Poor</option>
                  </select>
                </div>

                <!-- Comment -->
                <div class="mb-4">
                  <label class="form-label fw-semibold"> Your Comment </label>

                  <textarea
                    name="comment"
                    class="form-control"
                    rows="5"
                    placeholder="Write your feedback..."
                    maxlength="500"
                    required
                  ></textarea>
                </div>

                <!-- Submit -->
                <button
                  type="submit"
                  class="btn btn-primary w-100 py-2 fw-semibold"
                >
                  Submit Feedback
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="{{ url_for('static', filename='js/navbar.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
