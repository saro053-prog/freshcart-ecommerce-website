<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Create Account | Online Super Market</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        min-height: 100vh;
        background: linear-gradient(135deg, #f5f7fa, #e4ecf7);
      }

      .register-card {
        max-width: 850px;
        margin: 50px auto;
        border: none;
        border-radius: 20px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
        overflow: hidden;
      }

      .register-header {
        background: #212529;
        color: white;
        padding: 30px;
        text-align: center;
      }

      .register-body {
        padding: 35px;
        background: white;
      }

      .form-control {
        padding: 12px 15px;
        border-radius: 10px;
      }

      .form-label {
        font-weight: 600;
      }

      .register-btn {
        padding: 13px;
        border-radius: 10px;
        font-weight: 600;
      }
    </style>
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand fw-bold" href="/"> Online Super Market </a>

        <a href="/" class="btn btn-outline-light"> Home </a>
      </div>
    </nav>

    <!-- Register Card -->
    <div class="container">
      <div class="card register-card">
        <!-- Header -->
        <div class="register-header">
          <h2 class="fw-bold mb-2">Create Your Account</h2>

          <p class="mb-0">Join Online Super Market and start shopping</p>
        </div>

        <!-- Form -->
        <div class="register-body">
          {% if messages %}
          <div class="alert alert-danger" role="alert">
            {% for message in messages %}
            <div>{{ message }}</div>
            {% endfor %}
          </div>
          {% endif %}

          <form method="POST" action="/register">
            <div class="row g-4">
              <!-- First Name -->
              <div class="col-md-6">
                <label class="form-label"> First Name </label>

                <input
                  type="text"
                  name="first_name"
                  class="form-control"
                  placeholder="Enter first name"
                  required
                />
              </div>

              <!-- Last Name -->
              <div class="col-md-6">
                <label class="form-label"> Last Name </label>

                <input
                  type="text"
                  name="last_name"
                  class="form-control"
                  placeholder="Enter last name"
                  required
                />
              </div>

              <!-- DOB -->
              <div class="col-md-6">
                <label class="form-label"> Date of Birth </label>

                <input type="date" name="dob" class="form-control" required />
              </div>

              <!-- Mobile -->
              <div class="col-md-6">
                <label class="form-label"> Mobile Number </label>

                <input
                  type="tel"
                  name="mobile"
                  class="form-control"
                  placeholder="Enter mobile number"
                  required
                />
              </div>

              <!-- Email -->
              <div class="col-md-6">
                <label class="form-label"> Email Address </label>

                <input
                  type="email"
                  name="email"
                  class="form-control"
                  placeholder="Enter email"
                  required
                />
              </div>

              <!-- Password -->
              <div class="col-md-6">
                <label class="form-label"> Password </label>

                <input
                  type="password"
                  name="password"
                  class="form-control"
                  placeholder="Create password"
                  required
                />
              </div>

              <!-- Address -->
              <div class="col-12">
                <label class="form-label"> Address </label>

                <textarea
                  name="address"
                  class="form-control"
                  rows="3"
                  placeholder="Enter your full address"
                  required
                ></textarea>
              </div>
            </div>

            <!-- Register Button -->
            <div class="d-grid mt-4">
              <button type="submit" class="btn btn-dark register-btn">
                Create Account
              </button>
            </div>
          </form>

          <!-- Login Link -->
          <div class="text-center mt-4">
            <span class="text-muted"> Already have an account? </span>

            <a href="/login" class="fw-bold text-decoration-none"> Login </a>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="{{ url_for('static', filename='js/navbar.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
